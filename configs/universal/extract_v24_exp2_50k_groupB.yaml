# exp2 corpus scaled 10x (5000 -> 50000 passages) — Group B, run on GPU2.
out_dir: artifacts/wikicode_v24/exp2_50k
n_passages: 50000
max_chars: 4000
max_length: 512
batch_size: 8
dtype: fp16
seed: 0
depth_fraction: 0.5

pool:
  - tag: gemma2
    model: google/gemma-2-9b-it
    layer_index: 21
  - tag: lfm-7b
    model: LiquidAI/LFM2-1.2B
  - tag: qwen3-4b
    model: Qwen/Qwen3-4B
  # nemotron-mini-4b DROPPED — bin-only checkpoint, same CVE-2025-32434 issue as deepseek-llm-7b
  - tag: qwen3-1p7b
    model: Qwen/Qwen3-1.7B
  - tag: phi-1p5
    model: microsoft/phi-1_5
  - tag: smollm3-3b
    model: HuggingFaceTB/SmolLM3-3B
  # rugpt3-large DROPPED — bin-only checkpoint, same CVE-2025-32434 issue
  - tag: smollm2-360m
    model: HuggingFaceTB/SmolLM2-360M
  - tag: qwen3-0p6b
    model: Qwen/Qwen3-0.6B-Base
