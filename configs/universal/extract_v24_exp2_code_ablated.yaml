# v24 gen0 exp2 — code-ablated counterfactual: en-wiki 50 / {ru,zh,ja,de,es}wiki 50 (10 each), 0% code.
# Isolates code's specific contribution (angle G) vs "just more diverse text" (angle D).
# Same expanded 20-tag AV pool as exp1 (see that file's header note).
out_dir: artifacts/wikicode_v24/exp2_code_ablated
n_passages: 5000
max_chars: 4000
max_length: 512
batch_size: 8
dtype: fp16
seed: 0
depth_fraction: 0.5

pool:
  - tag: qwen3-1p7b
    model: Qwen/Qwen3-1.7B
  - tag: phi-1p5
    model: microsoft/phi-1_5
  - tag: smollm3-3b
    model: HuggingFaceTB/SmolLM3-3B
  - tag: qwen2p5-7b
    model: Qwen/Qwen2.5-7B
    layer_index: 20
  - tag: gemma2
    model: google/gemma-2-9b-it
    layer_index: 21
  - tag: bloom-560m
    model: bigscience/bloom-560m
  - tag: deepseek-llm-7b
    model: deepseek-ai/deepseek-llm-7b-base
  - tag: gemma4-e4b
    model: google/gemma-4-E4B
  - tag: gpt-neo-1p3b
    model: EleutherAI/gpt-neo-1.3B
  - tag: gpt2-medium
    model: openai-community/gpt2-medium
  - tag: lfm-7b
    model: LiquidAI/LFM2-1.2B
  - tag: nemotron-mini-4b
    model: nvidia/Nemotron-Mini-4B-Instruct
  - tag: pythia-410m
    model: EleutherAI/pythia-410m-deduped
  - tag: qwen2p5-0p5b
    model: Qwen/Qwen2.5-0.5B
  - tag: qwen3-0p6b
    model: Qwen/Qwen3-0.6B-Base
  - tag: qwen3-4b
    model: Qwen/Qwen3-4B
  - tag: rugpt3-large
    model: ai-forever/rugpt3large_based_on_gpt2
  - tag: smollm2-360m
    model: HuggingFaceTB/SmolLM2-360M
  - tag: vikhr-7b-01
    model: Vikhrmodels/Vikhr-7b-0.1
  - tag: yagpt-5-8b
    model: yandex/YandexGPT-5-Lite-8B-pretrain
