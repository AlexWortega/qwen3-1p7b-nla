# Re-extract the 12 genuinely-novel held-out organisms on exp2's SCALED 50k-passage corpus.
# Group B: run on GPU2.
out_dir: artifacts/wikicode_v24/exp2_50k
n_passages: 50000
max_chars: 4000
max_length: 512
batch_size: 8
dtype: fp16
seed: 0
depth_fraction: 0.5

pool:
  - tag: qwen1p5-7b
    model: Qwen/Qwen1.5-7B-Chat
    layer_index: 16
  - tag: qwen25-coder-7b
    model: Qwen/Qwen2.5-Coder-7B-Instruct
    layer_index: 14
  - tag: olmo2-1b
    model: allenai/OLMo-2-0425-1B-Instruct
    layer_index: 8
  - tag: llama3p2-1b
    model: unsloth/Llama-3.2-1B
    layer_index: 8
  - tag: qvikhr-1p7b
    model: Vikhrmodels/QVikhr-3-1.7B-Instruction-noreasoning
    layer_index: 14
  - tag: qwen2p5-1p5b
    model: Qwen/Qwen2.5-1.5B
    layer_index: 14
