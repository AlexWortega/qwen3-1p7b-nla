# v24 cross-model held-out sweep — extends the llama3-8b-only comparison to the OTHER 4 held-out
# organisms already extracted in ~/p3_work/v22_xmodel_bf16 (deepseek-llm-7b, lfm-7b, vikhr-7b-01,
# yagpt-5-8b). Answers: does exp1/exp2's win generalize beyond llama3-8b, or is it organism-specific?
# v22_flagship is included for a same-harness three-way comparison on every organism.

batch_size: 16
dtype: bf16
output_dir: /home/alexw/p3_work/wikicode_v24/eval_xmodel_sweep

detectors:
  - id: v22_flagship
    dir: /home/alexw/p3_work/detector/v22_1p7b_heldout_ep1
    label: "v22 flagship"
  - id: v24_exp1
    dir: /home/alexw/p3_work/wikicode_v24/exp1_train
    label: "v24 exp1 (wiki+code)"
  - id: v24_exp2
    dir: /home/alexw/p3_work/wikicode_v24/exp2_train
    label: "v24 exp2 (wiki-only, champion)"

tasks:
  # xarch POST for each of the 3 detectors x 4 additional held-out organisms
  - {id: xarch_deepseek_v22,  kind: xarch, detector: v22_flagship, organism: deepseek-llm-7b, organism_label: "DeepSeek-LLM-7B (held-out)", acts_dir: /home/alexw/p3_work/v22_xmodel_bf16, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
  - {id: xarch_deepseek_exp1, kind: xarch, detector: v24_exp1,     organism: deepseek-llm-7b, organism_label: "DeepSeek-LLM-7B (held-out)", acts_dir: /home/alexw/p3_work/v22_xmodel_bf16, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
  - {id: xarch_deepseek_exp2, kind: xarch, detector: v24_exp2,     organism: deepseek-llm-7b, organism_label: "DeepSeek-LLM-7B (held-out)", acts_dir: /home/alexw/p3_work/v22_xmodel_bf16, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}

  - {id: xarch_lfm_v22,  kind: xarch, detector: v22_flagship, organism: lfm-7b, organism_label: "LFM2-1.2B (held-out)", acts_dir: /home/alexw/p3_work/v22_xmodel_bf16, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
  - {id: xarch_lfm_exp1, kind: xarch, detector: v24_exp1,     organism: lfm-7b, organism_label: "LFM2-1.2B (held-out)", acts_dir: /home/alexw/p3_work/v22_xmodel_bf16, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
  - {id: xarch_lfm_exp2, kind: xarch, detector: v24_exp2,     organism: lfm-7b, organism_label: "LFM2-1.2B (held-out)", acts_dir: /home/alexw/p3_work/v22_xmodel_bf16, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}

  - {id: xarch_vikhr_v22,  kind: xarch, detector: v22_flagship, organism: vikhr-7b-01, organism_label: "Vikhr-7B-0.1 (held-out)", acts_dir: /home/alexw/p3_work/v22_xmodel_bf16, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
  - {id: xarch_vikhr_exp1, kind: xarch, detector: v24_exp1,     organism: vikhr-7b-01, organism_label: "Vikhr-7B-0.1 (held-out)", acts_dir: /home/alexw/p3_work/v22_xmodel_bf16, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
  - {id: xarch_vikhr_exp2, kind: xarch, detector: v24_exp2,     organism: vikhr-7b-01, organism_label: "Vikhr-7B-0.1 (held-out)", acts_dir: /home/alexw/p3_work/v22_xmodel_bf16, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}

  - {id: xarch_yagpt_v22,  kind: xarch, detector: v22_flagship, organism: yagpt-5-8b, organism_label: "YandexGPT-5-Lite-8B (held-out)", acts_dir: /home/alexw/p3_work/v22_xmodel_bf16, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
  - {id: xarch_yagpt_exp1, kind: xarch, detector: v24_exp1,     organism: yagpt-5-8b, organism_label: "YandexGPT-5-Lite-8B (held-out)", acts_dir: /home/alexw/p3_work/v22_xmodel_bf16, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
  - {id: xarch_yagpt_exp2, kind: xarch, detector: v24_exp2,     organism: yagpt-5-8b, organism_label: "YandexGPT-5-Lite-8B (held-out)", acts_dir: /home/alexw/p3_work/v22_xmodel_bf16, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
