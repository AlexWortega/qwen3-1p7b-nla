# v24 cross-model held-out sweep — for the vae_llm:latest Docker container on eva01.
# Container mounts: /mnt/storage/vae_llm/artifacts -> /big ; /home/alexw/vae_llm/{nla,scripts,
# configs} -> /workspace/{...} ; our new checkpoints mounted separately at /checkpoints (see
# docker run -v flag) since they live outside /mnt/storage/vae_llm/artifacts.

batch_size: 16
dtype: fp16
output_dir: /big/audit/eval_xmodel_sweep_v24

detectors:
  - id: v22_flagship
    dir: /big/audit/v22/v22_1p7b_heldout_ep1
    label: "v22 flagship"
  - id: v24_exp1
    dir: /checkpoints/exp1_train
    label: "v24 exp1 (wiki+code)"
  - id: v24_exp2
    dir: /checkpoints/exp2_train
    label: "v24 exp2 (wiki-only, champion)"

tasks:
  - {id: xarch_deepseek_v22,  kind: xarch, detector: v22_flagship, organism: deepseek-llm-7b, organism_label: "DeepSeek-LLM-7B (held-out)", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
  - {id: xarch_deepseek_exp1, kind: xarch, detector: v24_exp1,     organism: deepseek-llm-7b, organism_label: "DeepSeek-LLM-7B (held-out)", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
  - {id: xarch_deepseek_exp2, kind: xarch, detector: v24_exp2,     organism: deepseek-llm-7b, organism_label: "DeepSeek-LLM-7B (held-out)", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}

  - {id: xarch_lfm_v22,  kind: xarch, detector: v22_flagship, organism: lfm-7b, organism_label: "LFM2-1.2B (held-out)", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
  - {id: xarch_lfm_exp1, kind: xarch, detector: v24_exp1,     organism: lfm-7b, organism_label: "LFM2-1.2B (held-out)", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
  - {id: xarch_lfm_exp2, kind: xarch, detector: v24_exp2,     organism: lfm-7b, organism_label: "LFM2-1.2B (held-out)", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}

  - {id: xarch_vikhr_v22,  kind: xarch, detector: v22_flagship, organism: vikhr-7b-01, organism_label: "Vikhr-7B-0.1 (held-out)", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
  - {id: xarch_vikhr_exp1, kind: xarch, detector: v24_exp1,     organism: vikhr-7b-01, organism_label: "Vikhr-7B-0.1 (held-out)", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
  - {id: xarch_vikhr_exp2, kind: xarch, detector: v24_exp2,     organism: vikhr-7b-01, organism_label: "Vikhr-7B-0.1 (held-out)", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}

  - {id: xarch_yagpt_v22,  kind: xarch, detector: v22_flagship, organism: yagpt-5-8b, organism_label: "YandexGPT-5-Lite-8B (held-out)", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
  - {id: xarch_yagpt_exp1, kind: xarch, detector: v24_exp1,     organism: yagpt-5-8b, organism_label: "YandexGPT-5-Lite-8B (held-out)", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
  - {id: xarch_yagpt_exp2, kind: xarch, detector: v24_exp2,     organism: yagpt-5-8b, organism_label: "YandexGPT-5-Lite-8B (held-out)", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: "POST", n_per_bias: 80, n_neg: 80}
