# Direction + deception on the novel-organism subset that already has eval data (no new extraction
# needed). direction available for 7/12: lfm25-colbert-350m, llama3p2-1b, mistral-7b, olmo-1b,
# qvikhr-1p7b, qwen2p5-1p5b, smollm2-1p7b. deception available for 4/12: llama3p2-1b, qvikhr-1p7b,
# qwen2p5-1p5b, smollm2-1p7b.

batch_size: 16
dtype: fp16
output_dir: /big/audit/v22/eval_dirdecep_novel

detectors:
  - id: v22_ext
    dir: /big/audit/v22/v22_1p7b_heldout_ep1_ext
    label: "v22 flagship + 12 held-out"
  - id: exp2_50k_fixed
    dir: /workspace/artifacts/wikicode_v24/exp2_50k_fixedcache
    label: "v24 exp2 (50k, fixed cache)"

tasks:
  # direction
  - {id: dir_lfmcolbert_v22, kind: direction, detector: v22_ext, organism: lfm25-colbert-350m, organism_label: "LFM2.5-ColBERT-350M", acts_dir: /big/audit/v22_dir}
  - {id: dir_lfmcolbert_exp2, kind: direction, detector: exp2_50k_fixed, organism: lfm25-colbert-350m, organism_label: "LFM2.5-ColBERT-350M", acts_dir: /big/audit/v22_dir}
  - {id: dir_llama32_v22, kind: direction, detector: v22_ext, organism: llama3p2-1b, organism_label: "Llama-3.2-1B", acts_dir: /big/audit/v22_dir}
  - {id: dir_llama32_exp2, kind: direction, detector: exp2_50k_fixed, organism: llama3p2-1b, organism_label: "Llama-3.2-1B", acts_dir: /big/audit/v22_dir}
  - {id: dir_mistral_v22, kind: direction, detector: v22_ext, organism: mistral-7b, organism_label: "Mistral-7B-Instruct-v0.2", acts_dir: /big/audit/v22_dir}
  - {id: dir_mistral_exp2, kind: direction, detector: exp2_50k_fixed, organism: mistral-7b, organism_label: "Mistral-7B-Instruct-v0.2", acts_dir: /big/audit/v22_dir}
  - {id: dir_olmo1_v22, kind: direction, detector: v22_ext, organism: olmo-1b, organism_label: "OLMo-1B", acts_dir: /big/audit/v22_dir}
  - {id: dir_olmo1_exp2, kind: direction, detector: exp2_50k_fixed, organism: olmo-1b, organism_label: "OLMo-1B", acts_dir: /big/audit/v22_dir}
  - {id: dir_qvikhr_v22, kind: direction, detector: v22_ext, organism: qvikhr-1p7b, organism_label: "QVikhr-3-1.7B", acts_dir: /big/audit/v22_dir}
  - {id: dir_qvikhr_exp2, kind: direction, detector: exp2_50k_fixed, organism: qvikhr-1p7b, organism_label: "QVikhr-3-1.7B", acts_dir: /big/audit/v22_dir}
  - {id: dir_qwen251p5_v22, kind: direction, detector: v22_ext, organism: qwen2p5-1p5b, organism_label: "Qwen2.5-1.5B", acts_dir: /big/audit/v22_dir}
  - {id: dir_qwen251p5_exp2, kind: direction, detector: exp2_50k_fixed, organism: qwen2p5-1p5b, organism_label: "Qwen2.5-1.5B", acts_dir: /big/audit/v22_dir}
  - {id: dir_smollm2_v22, kind: direction, detector: v22_ext, organism: smollm2-1p7b, organism_label: "SmolLM2-1.7B", acts_dir: /big/audit/v22_dir}
  - {id: dir_smollm2_exp2, kind: direction, detector: exp2_50k_fixed, organism: smollm2-1p7b, organism_label: "SmolLM2-1.7B", acts_dir: /big/audit/v22_dir}

  # deception
  - {id: decep_llama32_v22, kind: deception, detector: v22_ext, organism: llama3p2-1b, organism_label: "Llama-3.2-1B", acts_dir: /big/audit/v22_decep}
  - {id: decep_llama32_exp2, kind: deception, detector: exp2_50k_fixed, organism: llama3p2-1b, organism_label: "Llama-3.2-1B", acts_dir: /big/audit/v22_decep}
  - {id: decep_qvikhr_v22, kind: deception, detector: v22_ext, organism: qvikhr-1p7b, organism_label: "QVikhr-3-1.7B", acts_dir: /big/audit/v22_decep}
  - {id: decep_qvikhr_exp2, kind: deception, detector: exp2_50k_fixed, organism: qvikhr-1p7b, organism_label: "QVikhr-3-1.7B", acts_dir: /big/audit/v22_decep}
  - {id: decep_qwen251p5_v22, kind: deception, detector: v22_ext, organism: qwen2p5-1p5b, organism_label: "Qwen2.5-1.5B", acts_dir: /big/audit/v22_decep}
  - {id: decep_qwen251p5_exp2, kind: deception, detector: exp2_50k_fixed, organism: qwen2p5-1p5b, organism_label: "Qwen2.5-1.5B", acts_dir: /big/audit/v22_decep}
  - {id: decep_smollm2_v22, kind: deception, detector: v22_ext, organism: smollm2-1p7b, organism_label: "SmolLM2-1.7B", acts_dir: /big/audit/v22_decep}
  - {id: decep_smollm2_exp2, kind: deception, detector: exp2_50k_fixed, organism: smollm2-1p7b, organism_label: "SmolLM2-1.7B", acts_dir: /big/audit/v22_decep}
