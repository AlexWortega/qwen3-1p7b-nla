# v24 — much broader held-out organism sweep, per user request ("хочу еще больше разных heldout
# организмов"). 12 new architectures never seen in AV training or prior eval: OLMo/OLMo2 (x3),
# Mistral/Ministral (x2), Qwen1.5-7B, Qwen2.5-Coder-7B, Qwen2.5-1.5B, SmolLM2-1.7B, Llama-3.2-1B,
# Qvikhr-1.7B, LFM2.5-ColBERT-350M. Encoders fitted via closed-form lstsq (add_held_out_tag, no
# GPU training) against each detector's own passage corpus. Eval data (bias-dialogue transcripts +
# activations) reused as-is from v22_xmodel — no new OpenRouter generation needed.

batch_size: 16
dtype: bf16
output_dir: /home/alexw/p3_work/wikicode_v24/newheldout/eval_out

detectors:
  - id: v22_ext
    dir: /home/alexw/p3_work/wikicode_v24/newheldout/v22_ext
    label: "v22 flagship + 12 new held-out encoders"
  - id: exp2_ext
    dir: /home/alexw/p3_work/wikicode_v24/newheldout/exp2_ext
    label: "v24 exp2 (champion) + 12 new held-out encoders"

tasks:
  - {id: xarch_lfmcolbert_v22,  kind: xarch, detector: v22_ext,  organism: lfm25-colbert-350m, organism_label: "LFM2.5-ColBERT-350M", acts_dir: /home/alexw/p3_work/v22_xmodel_bf16, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}
  - {id: xarch_lfmcolbert_exp2, kind: xarch, detector: exp2_ext, organism: lfm25-colbert-350m, organism_label: "LFM2.5-ColBERT-350M", acts_dir: /home/alexw/p3_work/v22_xmodel_bf16, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}

  - {id: xarch_ministral_v22,  kind: xarch, detector: v22_ext,  organism: ministral-8b, organism_label: "Ministral-8B-Instruct", acts_dir: /home/alexw/p3_work/v22_xmodel_bf16, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}
