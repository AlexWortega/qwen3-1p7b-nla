# Corrected re-run: exp2_50k with a PROPERLY rebuilt serve_cache (previously stale, inherited
# unchanged from the pre-SFT init bundle — this was likely the real cause of exp2's broken
# generalization to novel architectures, not corpus size or AV pool breadth). Tests all 12
# genuinely-novel held-out organisms against v22.

batch_size: 16
dtype: fp16
output_dir: /workspace/artifacts/wikicode_v24/eval_50k_fixedcache

detectors:
  - id: v22_flagship
    dir: /big/audit/v22/v22_1p7b_heldout_ep1
    label: "v22 flagship"
  - id: exp2_50k_fixed
    dir: /workspace/artifacts/wikicode_v24/exp2_50k_fixedcache
    label: "v24 exp2 (50k, corrected serve_cache)"

tasks:
  - {id: xarch_lfmcolbert_v22,  kind: xarch, detector: v22_flagship,     organism: lfm25-colbert-350m, organism_label: "LFM2.5-ColBERT-350M", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}
  - {id: xarch_lfmcolbert_fix,  kind: xarch, detector: exp2_50k_fixed,   organism: lfm25-colbert-350m, organism_label: "LFM2.5-ColBERT-350M", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}

  - {id: xarch_ministral_v22,  kind: xarch, detector: v22_flagship,     organism: ministral-8b, organism_label: "Ministral-8B-Instruct", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}
