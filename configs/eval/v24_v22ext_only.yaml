# v22 with properly-fitted held-out encoders for the 12 novel organisms (v22's own serve_cache was
# legitimately valid — this is just extending its coverage, not fixing a bug). Companion to
# v24_50k_fixedcache.yaml (which already scored exp2_50k_fixed on these organisms) — together these
# give the fair, apples-to-apples 12-organism comparison.

batch_size: 16
dtype: fp16
output_dir: /big/audit/v22/eval_v22ext_12organisms

detectors:
  - id: v22_ext
    dir: /big/audit/v22/v22_1p7b_heldout_ep1_ext
    label: "v22 flagship + 12 new held-out encoders"

tasks:
  - {id: xarch_lfmcolbert,  kind: xarch, detector: v22_ext, organism: lfm25-colbert-350m, organism_label: "LFM2.5-ColBERT-350M", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}
  - {id: xarch_ministral,  kind: xarch, detector: v22_ext, organism: ministral-8b, organism_label: "Ministral-8B-Instruct", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}
  - {id: xarch_mistral,  kind: xarch, detector: v22_ext, organism: mistral-7b, organism_label: "Mistral-7B-Instruct-v0.2", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}
  - {id: xarch_olmo1,  kind: xarch, detector: v22_ext, organism: olmo-1b, organism_label: "OLMo-1B", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}
  - {id: xarch_olmo2_1b,  kind: xarch, detector: v22_ext, organism: olmo2-1b, organism_label: "OLMo-2-1B-Instruct", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}
  - {id: xarch_olmo2_7b,  kind: xarch, detector: v22_ext, organism: olmo2-7b, organism_label: "OLMo-2-7B-Instruct", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}
  - {id: xarch_qwen15,  kind: xarch, detector: v22_ext, organism: qwen1p5-7b, organism_label: "Qwen1.5-7B-Chat", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}
  - {id: xarch_qwencoder,  kind: xarch, detector: v22_ext, organism: qwen25-coder-7b, organism_label: "Qwen2.5-Coder-7B-Instruct", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}
  - {id: xarch_llama32,  kind: xarch, detector: v22_ext, organism: llama3p2-1b, organism_label: "Llama-3.2-1B", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}
  - {id: xarch_qvikhr,  kind: xarch, detector: v22_ext, organism: qvikhr-1p7b, organism_label: "QVikhr-3-1.7B", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}
  - {id: xarch_qwen251p5,  kind: xarch, detector: v22_ext, organism: qwen2p5-1p5b, organism_label: "Qwen2.5-1.5B", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}
  - {id: xarch_smollm2,  kind: xarch, detector: v22_ext, organism: smollm2-1p7b, organism_label: "SmolLM2-1.7B", acts_dir: /big/audit/v22_xmodel, acts_name: acts.safetensors, label: POST, n_per_bias: 80, n_neg: 80}
