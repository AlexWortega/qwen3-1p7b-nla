[project]
name = "vae_llm"
version = "0.1.0"
description = "NLA warm-start (AV + AR initialization) on Qwen3-0.6B"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4,<2.6",
    "transformers>=4.46",
    "peft>=0.13",
    "accelerate>=1.0",
    "datasets>=3.0",
    "safetensors>=0.4",
    "wandb>=0.18",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nla*"]
